name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  # --- Release ---

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create release
        uses: softprops/action-gh-release@v3
