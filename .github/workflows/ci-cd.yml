name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  # --- Lint ---

  lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
            node-version-file: '.nvmrc'
            cache: 'npm'
      - name: npm clean install
        run: npm ci
      - run: node --run lint

  # --- Type Check ---

  check-types:
      # https://nodejs.org/learn/typescript/publishing-a-ts-package#what-to-do-with-your-types

      if: github.event_name == 'push' || github.event_name == 'pull_request'
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
            node-version-file: '.nvmrc'
            cache: 'npm'
        - name: npm clean install
          run: npm ci
        - run: node --run types:check

  # --- Release ---

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [lint, check-types]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create release
        uses: softprops/action-gh-release@v3

  # --- Deploy ---

  deploy:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [release]
    runs-on: self-hosted
    environment:
      name: production
      url: https://patriciaj.se/todo-calendar/
    permissions:
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: npm clean install
        run: npm ci
      
      - name: Run vite build
        run: npm run build

      - name: Publish build
        run: |
          sudo rsync -a --delete dist/ /var/www/todo-calendar/
